conky.config = {
    background = true,
    update_interval = 2,
    total_run_times = 0,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    default_color = 'e8eaf2',
    color1 = '8b93b8',
    color2 = '7f9cf5',
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 64,
    minimum_width = 240,
    use_xft = true,
    font = 'Cantarell:size=10',
    uppercase = false,
}

conky.text = [[
${color2}ALI Linux ${color1}${execi 3600 cat /etc/os-release | grep -m1 VERSION_ID | cut -d'"' -f2}
${color2}${time %H:%M}${color}  ${time %a %d %b}
${color1}up ${uptime_short}  |  ${execi 300 cat /run/ali-updates 2>/dev/null || echo ?} updates
${color}CPU ${cpu}% ${cpubar 6,120}
MEM ${memperc}% ${membar 6,120}
DISK ${fs_used_perc /}% ${fs_bar 6,120 /}
${color1}NET ${upspeedf} up / ${downspeedf} down
${color2}TOP${color}
${color1}1 ${top name 1}${color} ${top cpu 1}%
${color1}2 ${top name 2}${color} ${top cpu 2}%
${color1}3 ${top name 3}${color} ${top cpu 3}%
]]
