name: Build ALI Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Build ALI apps (.deb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config make gcc dpkg-dev
          (cd apps/ali-center && make && sh ./build-deb.sh)
          (cd apps/ali-notepad && make && sh ./build-deb.sh)
          mkdir -p config/packages.chroot
          cp apps/ali-center/*.deb apps/ali-notepad/*.deb config/packages.chroot/ || true
          ls -lh config/packages.chroot/

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso isolinux syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools dosfstools memtest86+ debian-archive-keyring git make cpio apt-utils gettext po4a
          # Ubuntu's live-build is an ancient fork (uses --bootloader singular, no --image-name).
          # Install real Debian live-build from salsa so trixie flags work.
          rm -rf /tmp/live-build
          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          sudo make -C /tmp/live-build install
          lb --version
          lb config --help | grep -E "bootloaders|image-name|architecture" || true

      - name: Build ISO
        run: |
          sudo lb clean || true
          sudo sh auto/config
          sudo lb build
          ls -lh *.iso *.hybrid.iso 2>/dev/null || ls -lh *.iso || true
          sudo sha256sum *.iso > SHA256SUMS.txt || true
          ls -lh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v5
        with:
          name: ali-linux-iso
          path: |
            *.iso
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
